<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cdisk.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDisk Savior</title>
    <style>
      /* 消除启动闪烁：tokens.css 的 :root 默认深色 --color-bg 会应用到
         body（background: var(--color-bg)），且其 link 在本 style 之后
         加载、优先级更高 → React 挂载前窗口闪深色。
         !important 锁浅色；App 根 div 铺满全屏且自带主题背景，
         深色主题用户不受影响。 */
      html, body { background: #f4f6f9 !important; }
      @keyframes cds-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- 静态启动骨架：React 挂载前显示（挂载时 createRoot 自动替换），
         保证任何时刻 show 窗口都是有内容的（零白屏兜底） -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f4f6f9;gap:16px;font-family:'Segoe UI',system-ui,sans-serif;">
        <div style="width:42px;height:42px;border:4px solid #d7dde6;border-top-color:#0e7490;border-radius:50%;animation:cds-spin .9s linear infinite;"></div>
        <div style="color:#5b6b7c;font-size:13px;">正在启动 CDisk Savior…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
