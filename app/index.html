<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cdisk.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDisk Savior</title>
    <style>
      /* 消除启动闪烁：tokens.css 的 :root 默认深色 --color-bg 会应用到
         body（background: var(--color-bg)），且其 link 在本 style 之后
         加载、优先级更高 → React 挂载前窗口闪深色。
         !important 锁浅色；App 根 div 铺满全屏且自带主题背景，
         深色主题用户不受影响。 */
      html, body { background: #f4f6f9 !important; }
      @keyframes cds-spin { to { transform: rotate(360deg); } }
      @keyframes cds-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <!-- 内联静态欢迎页（独立于 #root，LightC 同款方案）：
         HTML 解析即绘制，窗口一出现就是有内容的品牌页。
         React 渲染在 #root 进行（被本层覆盖），App 挂载完成 + 首帧
         绘制后由 App.tsx 移除本层，无缝衔接完整 UI。 -->
    <div id="splash" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;background:#f4f6f9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
      <div style="width:32px;height:32px;border:3px solid #d7dde6;border-top-color:#0e7490;border-radius:50%;animation:cds-spin .9s linear infinite;"></div>
      <div style="color:#64748b;font-size:13px;">正在启动…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
