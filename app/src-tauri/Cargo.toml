[package]
name = "cdisk-savior"
version = "0.1.0"
description = "CDisk Savior - 磁盘与内存维护助手"
authors = ["you"]
edition = "2021"
default-run = "cdisk-savior"

[lib]
name = "cdisk_savior_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P2: M4 空间腾挪 + 基础设施（设计文档 §5.1）
junction = "1"                                              # V8 修复：FSCTL 创建 Junction，弃 cmd /C mklink
uuid = { version = "1", features = ["v4"] }                  # 迁移记录 ID
chrono = { version = "0.4", features = ["serde"] }           # 时间戳
walkdir = "2"                                               # 目录遍历
jwalk = "0.8"                                                # P3: 并行目录扫描（TreeMap）
winreg = "0.52"                                               # P6: 注册表读写（启动项管理）
filetime = "0.2"                                            # V7：保留 mtime
log = "0.4"                                                 # 日志
windows-sys = { version = "0.59", features = [               # Win32 API（disk-butler 同版）
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_RestartManager",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_ToolHelp",
] }

# 修复：tauri-utils → schemars/preserve_order → indexmap 1.9 的 build.rs 用 autocfg 探测 std，
# MSVC 装在非标准路径时探测失败 → has_std 未设置 → no_std 分支（IndexMap 泛型无默认值）→ E0107。
# 显式启用 std feature 跳过探测（CARGO_FEATURE_STD 直接 emit has_std）。
indexmap = { version = "1", features = ["std"] }

[features]
# 生产构建必须启用：内嵌 frontendDist 资源；缺失时二进制回退 devUrl（localhost 拒绝连接）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 1
