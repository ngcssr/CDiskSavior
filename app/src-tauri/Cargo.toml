[package]
name = "cdisk-savior"
version = "0.1.0"
description = "CDisk Savior - 磁盘与内存维护助手"
authors = ["you"]
edition = "2021"
default-run = "cdisk-savior"

[lib]
name = "cdisk_savior_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cdisk-savior-svc"
path = "src/bin/cdisk-savior-svc.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"                                     # P1: 保存对话框（增长报告导出）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P2: M4 空间腾挪 + 基础设施（设计文档 §5.1）
junction = "1"                                              # V8 修复：FSCTL 创建 Junction，弃 cmd /C mklink
uuid = { version = "1", features = ["v4"] }                  # 迁移记录 ID
chrono = { version = "0.4", features = ["serde"] }           # 时间戳
regex = "1"                                                 # M5: 注册表残留命令行路径解析
trash = "5"                                                 # P2: 回收站删除（合并设计 §5.1 定案）
sysinfo = "0.32"                                            # Q4: 软件体检后台常驻进程内存
image = { version = "0.25", default-features = false, features = ["png"] }  # Q4: 图标抠取 PNG 编码

# C1: MFT 扫描服务（CDiskSaviorSvc）
ntfs-reader = "=0.4.5"                                      # MFT 直读引擎（disk-butler 同版；0.4.7 起 Mft 字段私有化无法外部构造）
windows-service = "0.8"                                     # SCM 服务框架
ureq = { version = "2", default-features = false, features = ["native-tls"] }  # 联网更新检测（Windows 走 schannel，无额外加密库）
rayon = "1"                                                 # MFT 记录并行解析
walkdir = "2"                                               # 目录遍历
jwalk = "0.8"                                                # P3: 并行目录扫描（TreeMap）
winreg = "0.52"                                               # P6: 注册表读写（启动项管理）
filetime = "0.2"                                            # V7：保留 mtime
log = "0.4"                                                 # 日志
windows = { version = "0.62", features = [                  # Win32 绑定统一目标（合并设计 §5.1，C2 迁移中）
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_RestartManager",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# 修复：tauri-utils → schemars/preserve_order → indexmap 1.9 的 build.rs 用 autocfg 探测 std，
# MSVC 装在非标准路径时探测失败 → has_std 未设置 → no_std 分支（IndexMap 泛型无默认值）→ E0107。
# 显式启用 std feature 跳过探测（CARGO_FEATURE_STD 直接 emit has_std）。
indexmap = { version = "1", features = ["std"] }

[features]
# 生产构建必须启用：内嵌 frontendDist 资源；缺失时二进制回退 devUrl（localhost 拒绝连接）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 与 light-c 对齐：Rust 默认 release profile（opt3，无 LTO，codegen-units=16）
# fat LTO + 单 codegen-unit 在 I/O 密集的 $MFT 顺序读场景反优化（实测慢于默认）
opt-level = 3
strip = "symbols"
debug = false
panic = "unwind"
